name: Refresh conditions

# Fetches Open-Meteo forecasts for every hit list area (scripts/conditions/fetch.py) and publishes them as
# conditions.json on the `conditions-data` branch, where the app reads them so it opens with conditions
# already loaded. Runs every 3 hours, and can be run by hand from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conditions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch forecasts
        run: python scripts/conditions/fetch.py
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          OUT: ${{ runner.temp }}/conditions.json
      - name: Publish to the conditions-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          mkdir publish && cp conditions.json publish/ && cd publish
          git init -q -b conditions-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conditions.json
          git commit -qm "Conditions $(date -u +%FT%TZ)"
          # One commit, replaced each run, so the branch never grows.
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" conditions-data
