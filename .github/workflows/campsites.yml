name: Check campsites

# Reads free nights for the NSW National Parks campgrounds on the hit list
# (scripts/campsites/check.py) and publishes them as campsites.json on the
# `campsite-data` branch, where the app reads them. Runs every 6 hours, and
# can be run by hand from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campsites
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/campsites/requirements.txt
      - run: pip install -r scripts/campsites/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check availability
        run: python scripts/campsites/check.py
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          OUT: ${{ runner.temp }}/campsites.json
      - name: Publish to the campsite-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          mkdir publish && cp campsites.json publish/ && cd publish
          git init -q -b campsite-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campsites.json
          git commit -qm "Campsite availability $(date -u +%FT%TZ)"
          # One commit, replaced each run, so the branch never grows.
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" campsite-data
